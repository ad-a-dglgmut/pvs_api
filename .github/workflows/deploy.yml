name: Deploy API to EC2

on:
  push:
    branches: [main]      # change if your branch is called differently
  workflow_dispatch:       # lets you also run it by hand

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: ./mvnw -B -q package -DskipTests

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Upload jar
        run: |
          scp -i ~/.ssh/key.pem target/pvs-*.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/pvs/app.jar.new

      - name: Restart service
        run: |
          ssh -i ~/.ssh/key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'mv ~/pvs/app.jar.new ~/pvs/app.jar && sudo systemctl restart pvs'